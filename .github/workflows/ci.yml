name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"
      NODE_ENV: "production"
      DATABASE_URL: "postgresql://ci_user:ci_password@localhost:5432/schoolyard_ci?schema=public"
      CLERK_SECRET_KEY: "sk_test_ci_dummy_secret_key_for_build"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_ci_dummy_public_key_for_build"
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: "/sign-in"
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: "/sign-up"
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: "/"
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: "/"
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: "demo"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Static Code Analysis (ESLint)
        run: npm run lint

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Validate Target Prisma Schema
        run: npm run prisma:validate:target

      - name: Run Unit & Integration Tests (Vitest)
        run: npm run test
        env:
          NODE_ENV: "test"

      - name: Next.js Production Build
        run: npm run build
